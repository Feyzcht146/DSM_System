# dsm.conf - configuracion compartida por todos los nodos
page_size             = 4096           # bytes; potencia de 2, multiplo de la pagina del SO
default_node_memory   = 1048576        # bytes por default aportados por nodo (1 MiB)
base_address          = 0x200000000000 # direccion virtual comun del espacio DSM (zona libre)
port_min              = 27100
port_max              = 27199
heartbeat_interval_ms = 1000
heartbeat_timeout_ms  = 3500
request_timeout_ms    = 2000
request_retries       = 3
fault_threads         = 2
service_threads       = 2
protocol_workers      = 4
max_threads           = 64             # hilos de aplicacion registrables por nodo
max_pending           = 128            # solicitudes on air por nodo
max_payload           = 65536          # bytes; >= page_size
log_level             = info           # error | warn | info | debug

# Nodos posibles del cluster por defecto
# 127.0.0.1 para localhost y la IP para otras computadoras; los puertos pueden quedar iguales
#     id  host            data_port  hb_port  memoria (opcional)
node = 0  127.0.0.1       27100      27101    1048576
node = 1  127.0.0.1       27102      27103    
node = 2  127.0.0.1       27104      27105    1048576
